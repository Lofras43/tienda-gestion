# Configuración de la aplicación
spring.application.name=tienda-gestion
spring.application.version=1.0.0

# Conexión a MySQL (Hostinger remoto)
spring.datasource.url=jdbc:mysql://srv1456.hstgr.io:3306/u450735954_Integrador?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:u450735954_Integrador}
spring.datasource.password=${DB_PASS:Integrador#123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL init (schema.sql para tablas faltantes)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuración del servidor
server.port=8080
server.forward-headers-strategy=framework
server.address=0.0.0.0

# Actuator - Monitoreo
management.endpoints.web.exposure.include=health,info,metrics,env,logfile
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Tienda Gestión
info.app.version=1.0.0
info.app.description=Sistema de Gestión Inteligente para Tiendas Pequeñas

# Logging
logging.level.com.tienda.tienda_gestion=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/tienda-gestion.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Configuración del backup diario
backup.database.url=jdbc:mysql://srv1456.hstgr.io:3306/u450735954_Integrador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
backup.database.username=${DB_USER:u450735954_Integrador}
backup.database.password=${DB_PASS:Integrador#123}
backup.directory=backups/